<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BLASTMAP Marketing Preview</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        margin: 0;
        padding: 40px;
        background: #0a0a1a;
        color: #e2e8f0;
        font-family: 'Segoe UI', system-ui, sans-serif;
        min-height: 100vh;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      h1 {
        font-size: 48px;
        color: #8b5cf6;
        margin-bottom: 8px;
      }
      .subtitle {
        font-size: 20px;
        color: #94a3b8;
        margin-bottom: 32px;
      }
      video {
        width: 100%;
        max-width: 960px;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        background: #000;
      }
      .back-link {
        display: inline-block;
        margin-top: 32px;
        color: #8b5cf6;
        text-decoration: none;
        font-size: 18px;
      }
      .back-link:hover {
        text-decoration: underline;
      }
      .video-section {
        margin-top: 40px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>BLASTMAP Marketing Video</h1>
      <p class="subtitle">Precision Blast Pattern Design Software</p>
      
      <div class="video-section">
        <video controls poster="data/blastmap-preview-poster.jpg">
          <source src="data/blastmap-marketing-preview.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>
      
      <a href="index.html" class="back-link">← Back to Insights Hub</a>
    </div>
  </body>
</html>
