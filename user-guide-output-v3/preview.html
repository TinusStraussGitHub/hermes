        .footer .brand { font-size: 11pt; font-weight: 700; color: #BF0000; }
        img { max-width: 100%; height: auto; display: block; margin: 10px 0; border: 1px solid #e0e0e0; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .image-caption { font-size: 8.5pt; color: #666; margin-top: 6px; font-style: italic; text-align: center; }
        .image-container { text-align: center; margin: 14px 0; page-break-inside: avoid; }
    </style>
</head>
