    .stat-value { font-weight: 600; }
    .upload-content { padding: 20px; display: none; }

    .hole-card {
      border: 1px solid var(--color-border);
      border-radius: 8px;
      margin-bottom: 12px;
      background: #fafafa;

    const IGNORE_FIELDS = new Set(['created', 'createdBy', 'lastModified', 'lastModifiedBy', 'uid', 'uploadId', 'holeId', 'deckId', 'blockId']);
    let currentState = {};

    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('generated-date').textContent = new Date().toISOString().slice(0, 10);
      renderUploadHistory(uploadsData);
    });

    function expandAll() {
      document.querySelectorAll('.upload-content').forEach(el => el.classList.add('active'));
      document.querySelectorAll('.toggle-icon').forEach(el => el.classList.add('open'));
    }

    function collapseAll() {
      document.querySelectorAll('.upload-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.toggle-icon').forEach(el => el.classList.remove('open'));
    }

    function toggleUpload(id) {
      const c = document.getElementById('content-' + id);
      const i = document.getElementById('icon-' + id);
      c.classList.toggle('active');
      i.classList.toggle('open');
    }

    function formatOpType(t) {
      return {initial: 'Initial Upload', add_holes: 'Holes Added', remove_holes: 'Holes Removed', update_holes: 'Holes Updated'}[t] || t;
    }

    function renderUploadHistory(uploads) {
      const container = document.getElementById('upload-timeline');
      container.innerHTML = '';
      currentState = {};

      uploads.forEach((u, i) => {
        const op = u.metadata?.operationType || 'initial';
        const ts = u.created._seconds + (u.created._nanoseconds || 0) / 1e9;
        const dt = new Date(ts);
        const datetime = dt.toISOString().slice(0, 19).replace('T', ' ');
        const user = u.createdBy ? u.createdBy.firstName + ' ' + u.createdBy.lastName : 'Unknown';
        const holes = u.holes || [];
        const decks = holes.reduce((s, h) => s + (h.decks?.length || 0), 0);

        let stats = '';
        if (op === 'initial') stats = '<span class="stat-item"><span class="stat-label">Holes Loaded:</span> <span class="stat-value">' + holes.length + '</span></span><span class="stat-item"><span class="stat-label">Decks Loaded:</span> <span class="stat-value">' + decks + '</span></span>';
        else if (op === 'add_holes') stats = '<span class="stat-item"><span class="stat-label">Added Holes:</span> <span class="stat-value">' + holes.length + '</span></span><span class="stat-item"><span class="stat-label">Added Decks:</span> <span class="stat-value">' + decks + '</span></span>';
        else if (op === 'remove_holes') stats = '<span class="stat-item"><span class="stat-label">Removed Holes:</span> <span class="stat-value">' + holes.length + '</span></span><span class="stat-item"><span class="stat-label">Removed Decks:</span> <span class="stat-value">' + decks + '</span></span>';
        else if (op === 'update_holes') {
          const c = calculateChanges(holes);
          stats = '<span class="stat-item"><span class="stat-label">Updated Holes:</span> <span class="stat-value">' + c.holes + '</span></span><span class="stat-item"><span class="stat-label">Updated Decks:</span> <span class="stat-value">' + c.decks + '</span></span><span class="stat-item"><span class="stat-label">Changed Fields:</span> <span class="stat-value">' + c.fields + '</span></span>';
        }

        container.innerHTML += '<div class="upload-card ' + op + '"><div class="upload-header" onclick="toggleUpload(' + i + ')"><span class="op-badge ' + op + '">' + formatOpType(op) + '</span><span class="upload-title">Upload #' + (i + 1) + '</span><span class="upload-datetime">' + datetime + '</span><span class="upload-user">by ' + user + '</span><span class="toggle-icon" id="icon-' + i + '">▶</span></div><div class="upload-stats">' + stats + '</div><div class="upload-content" id="content-' + i + '">' + renderHoles(holes) + '</div></div>';
      });
    }

    function calculateChanges(holes) {
      let ch = 0, cd = 0, cf = 0;
      holes.forEach(h => {
        const id = h.holeId;
        if (!currentState[id]) return;
        const d = compareObjects(h, currentState[id], ['decks']);
        if (Object.keys(d).length > 0) { ch++; cf += Object.keys(d).length; }
        (h.decks || []).forEach(dk => {
          const pd = currentState[id].decks?.find(x => x.deckId === dk.deckId);
          if (pd) { const dd = compareObjects(dk, pd); if (Object.keys(dd).length > 0) { cd++; cf += Object.keys(dd).length; } }
        });
      });
      return {holes: ch, decks: cd, fields: cf};
    }

    function compareObjects(a, b, ig = []) {
      const d = {};
      for (const k in a) {
        if (IGNORE_FIELDS.has(k) || ig.includes(k)) continue;
        if (JSON.stringify(a[k]) !== JSON.stringify(b[k])) d[k] = {old: b[k], new: a[k]};
      }
      return d;
    }

    function renderHoles(holes) {
      let h = '';
      holes.forEach(hl => {
        const nm = hl.name || '-';
        const tp = hl.type || '-';
        const dp = hl.drillDepth ? hl.drillDepth + 'm (&plusmn;' + (hl.drillDepthTolerance || 0) + 'm)' : '-';
        const dm = hl.diameter ? hl.diameter + 'mm' : '-';
        const xc = hl.x ?? '-';
        const yc = hl.y ?? '-';
        const zc = hl.z ?? '-';
        const dks = hl.decks || [];

        const hi = hl.holeId;
        if (!currentState[hi]) currentState[hi] = {};
        Object.assign(currentState[hi], hl);

        h += '<div class="hole-card"><div class="hole-header"><span class="hole-name">' + nm + '</span><span class="hole-type">' + tp + '</span></div><div class="hole-details"><div><strong>Depth:</strong> ' + dp + '</div><div><strong>Diameter:</strong> ' + dm + '</div><div><strong>Decks:</strong> ' + dks.length + '</div><div><strong>Drill Angle:</strong> ' + (hl.drillAngle ?? '-') + '&deg;</div><div><strong>Drill Bearing:</strong> ' + (hl.drillBearing ?? '-') + '&deg;</div></div><div class="hole-location"><strong>Location:</strong> X=' + xc + ', Y=' + yc + ', Z=' + zc + '</div><div class="decks-container">' + dks.map(dk => '<div class="deck-card"><div class="deck-name">Deck ' + (dk.deckNumber || '-') + '</div><div class="deck-details"><span>Stemming: ' + (dk.stemmingValue ? dk.stemmingValue + 'm' : '-') + '</span><span>Charge: ' + (dk.chargeValue ?? '-') + '</span><span>Length: ' + (dk.plannedLength ?? '-') + '</span><span>Air Deck: ' + (dk.isAirDeck ? 'Yes' : 'No') + '</span></div></div>').join('') + '</div></div>';
      });
      return h || '<div style="padding:20px;color:var(--color-text-secondary)">No holes</div>';
    }
  </script>
