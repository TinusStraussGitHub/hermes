<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>XPLOLOG Block History Report | BME Blasting Solutions</title>
<!-- Material Symbols for Icons -->

<!-- Hanken Grotesk via Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "secondary-fixed": "#ffdad4",
            "on-primary-container": "#fffbff",
            "on-secondary": "#ffffff",
            "on-primary-fixed": "#410000",
            "surface-dim": "#dcd9d9",
            "surface-container-highest": "#e5e2e1",
            "surface-tint": "#c00100",
            "surface-container-high": "#ebe7e7",
            "inverse-surface": "#313030",
            "beyond-red": "#FF0000",
            "surface-container": "#f0edec",
            "on-secondary-fixed-variant": "#930000",
            "surface": "#fcf9f8",
            "surface-container-low": "#f6f3f2",
            "primary-container": "#eb0000",
            "inferno": "#FF4E00",
            "totalHolesOverDrilled": "#FF4E00",
            "surface-container-lowest": "#ffffff",
            "surface-variant": "#e5e2e1",
            "on-tertiary": "#ffffff",
            "background": "#fcf9f8",
            "primary": "#bc0100"
          },
          "borderRadius": {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
          "spacing": {
            "xl": "80px",
            "margin": "32px",
            "gutter": "24px",
            "lg": "48px",
            "md": "24px",
            "sm": "12px",
            "base": "8px",
            "xs": "4px"
          },
          "fontFamily": {
            "label-caps": ["Hanken Grotesk"],
            "h2": ["Hanken Grotesk"],
            "body-lg": ["Hanken Grotesk"],
            "body-md": ["Hanken Grotesk"],
            "h3": ["Hanken Grotesk"],
            "h1": ["Hanken Grotesk"]
          },
          "fontSize": {
            "label-caps": ["14px", {"lineHeight": "1.2", "letterSpacing": "0.1em", "fontWeight": "700"}],
            "h2": ["32px", {"lineHeight": "1.2", "letterSpacing": "0.02em", "fontWeight": "700"}],
            "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
            "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
            "h3": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
            "h1": ["48px", {"lineHeight": "1.1", "letterSpacing": "0.05em", "fontWeight": "800"}]
          }
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body { font-family: 'Hanken Grotesk', sans-serif; }
    .diagonal-cut { clip-path: polygon(0 0, 100% 0, 95% 100%, 0% 100%); }
    .bg-grid-overlay {
      background-image: linear-gradient(to right, rgba(215, 207, 205, 0.1) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(215, 207, 205, 0.1) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .text-ore { color: #141414; }
    .bg-ore { background: #141414; }
    .text-quarry { color: #D7CFCD; }
    .bg-quarry { background: #D7CFCD; }
    .border-quarry { border-color: #D7CFCD; }
    .text-charcoal { color: #3F3D3D; }
    .bg-charcoal { background: #3F3D3D; }
    .border-charcoal { border-color: #3F3D3D; }
  </style>
</head>
<body class="bg-surface text-on-surface min-h-screen">
<!-- Main Canvas -->
<main class="flex flex-col min-h-screen">
<!-- Top AppBar -->
<header class="bg-primary full-width top-0 z-40 border-b border-primary-container shadow-md flex justify-between items-center w-full px-margin py-base">
<div class="flex items-center gap-md">
<h1 class="font-h1 text-h3 font-black text-white tracking-tighter">XPLOLOG</h1>
<div class="h-6 w-px bg-white/20 hidden md:block"></div>
<p class="font-label-caps text-[12px] text-white/90 hidden md:block tracking-[0.2em]">OPERATIONAL DATA SYSTEMS</p>
</div>
<div class="flex items-center gap-md">
<div class="flex gap-xs">
</div>
</div>
</header>
<!-- Content Header Section -->
<section class="relative bg-ore pt-lg pb-xl px-margin overflow-hidden">
<div class="absolute inset-0 bg-grid-overlay opacity-20"></div>
<div class="relative z-10 flex flex-col md:flex-row md:items-end justify-between gap-md">
<div class="max-w-3xl">
<div class="flex items-center gap-xs mb-2">
<span class="w-8 h-1 bg-beyond-red"></span>
<p class="font-label-caps text-label-caps text-primary uppercase">QA Site Operations</p>
</div>
<h2 class="font-h1 text-h1 text-white uppercase tracking-tight mb-xs">Block History Report</h2>
<p class="font-body-lg text-body-lg text-quarry">Block Reference: <span class="text-white font-bold tracking-widest">UploadTest</span></p>
</div>
<div class="bg-charcoal/50 backdrop-blur-md p-md border-l-4 border-beyond-red">
<p class="font-label-caps text-label-caps text-quarry mb-1 uppercase">Generated At</p>
<p class="font-h3 text-h3 text-white" id="generated-date"></p>
</div>
</div>
</section>
<!-- Summary Section -->
<section class="px-margin -mt-8 relative z-20">
<div class="grid grid-cols-1 md:grid-cols-4 gap-gutter" id="summary-cards">
</div>
</section>
<!-- Main Content Area -->
<div class="p-margin flex flex-col gap-lg" id="uploads-container">
</div>
</main>
<!-- Mobile FAB -->
<div class="md:hidden fixed bottom-margin right-margin z-50">
<button class="bg-beyond-red text-white w-16 h-16 rounded-full shadow-2xl flex items-center justify-center">
<span class="material-symbols-outlined text-3xl" data-icon="download">download</span>
</button>
</div>
<script>
// Load data from JSON file
async function loadData() {
  const response = await fetch('https://raw.githubusercontent.com/TinusStraussGitHub/hermes/main/xplolog/block_history_UploadTest.json');
  const data = await response.json();
  return data;
}

function formatDate(seconds) {
  if (!seconds) return 'N/A';
  const d = new Date(seconds * 1000);
  return d.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', year: 'numeric' }) + ', ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: 'numeric', hour12: true });
}

// Get operation type from upload - defaults to 'add' for new uploads
function getOperationType(upload) {
  const op = (upload.metadata?.operationType || upload.operationType || '').toLowerCase();
  if (op.includes('delete')) return 'delete';
  if (op.includes('update')) return 'update';
  return 'add'; // Default to add
}

// Initialize when page loads
document.addEventListener('DOMContentLoaded', async function() {
  const data = await loadData();
  const uploads = data.uploads || [];

  // Generate current date for header
  document.getElementById('generated-date').textContent = new Date().toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', year: 'numeric' }) + ', ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: 'numeric', hour12: true });

  // Calculate summary stats by operation type
  let totalHoles = 0;
  let addCount = 0, updateCount = 0, deleteCount = 0;
  
  uploads.forEach(u => {
    const holes = u.holes?.length || 0;
    totalHoles += holes;
    const op = getOperationType(u);
    if (op === 'delete') deleteCount += holes;
    else if (op === 'update') updateCount += holes;
    else addCount += holes;
  });

  // Render summary cards
  document.getElementById('summary-cards').innerHTML = `
    <div class="bg-white shadow-xl p-md border-b-4 border-charcoal flex items-center justify-between">
      <div>
        <p class="font-label-caps text-label-caps text-on-surface-variant mb-1 uppercase">Total Uploads</p>
        <h3 class="font-h2 text-h2 text-ore">${uploads.length}</h3>
      </div>
      <span class="material-symbols-outlined text-charcoal text-4xl" data-icon="upload">upload</span>
    </div>
    <div class="bg-white shadow-xl p-md border-b-4 border-[#4CAF50] flex items-center justify-between">
      <div>
        <p class="font-label-caps text-label-caps text-on-surface-variant mb-1 uppercase text-[#2E7D32]">Additions</p>
        <h3 class="font-h2 text-h2 text-ore">${addCount}</h3>
      </div>
      <span class="material-symbols-outlined text-[#4CAF50] text-4xl" data-icon="add_circle">add_circle</span>
    </div>
    <div class="bg-white shadow-xl p-md border-b-4 border-[#2196F3] flex items-center justify-between">
      <div>
        <p class="font-label-caps text-label-caps text-on-surface-variant mb-1 uppercase text-[#1565C0]">Updates</p>
        <h3 class="font-h2 text-h2 text-ore">${updateCount}</h3>
      </div>
      <span class="material-symbols-outlined text-[#2196F3] text-4xl" data-icon="update">update</span>
    </div>
    <div class="bg-white shadow-xl p-md border-b-4 border-[#F44336] flex items-center justify-between">
      <div>
        <p class="font-label-caps text-label-caps text-on-surface-variant mb-1 uppercase text-[#C62828]">Deletions</p>
        <h3 class="font-h2 text-h2 text-ore">${deleteCount}</h3>
      </div>
      <span class="material-symbols-outlined text-[#F44336] text-4xl" data-icon="delete_forever">delete_forever</span>
    </div>
  `;

  // Render upload sections
  let html = '';
  uploads.forEach((upload, i) => {
    const holes = upload.holes || [];
    const opType = getOperationType(upload);
    const sectionId = `upload-${i}`;
    const buttonId = `btn-${i}`;
    
    // Color based on operation type
    const headerColor = opType === 'delete' ? '#F44336' : opType === 'update' ? '#2196F3' : '#4CAF50';
    const opLabel = opType === 'delete' ? 'DELETE HOLES' : opType === 'update' ? 'UPDATE HOLES' : 'ADD HOLES';
    
    html += `
    <section class="bg-white border border-quarry shadow-sm" id="${sectionId}">
      <div class="text-white px-md py-sm flex justify-between items-center diagonal-cut w-full" style="background-color: ${headerColor};">
        <h4 class="font-label-caps text-label-caps uppercase tracking-widest flex items-center gap-xs">
          <span class="material-symbols-outlined text-sm" data-icon="history">history</span>
          ${opLabel} (${holes.length})
        </h4>
        <span class="font-label-caps text-label-caps">LAST SYNC: ${formatDate(upload.created?._seconds)}</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead class="bg-surface-container border-b border-quarry">
            <tr>
              <th class="px-md py-sm font-label-caps text-label-caps text-on-surface-variant">HOLE NAME</th>
              <th class="px-md py-sm font-label-caps text-label-caps text-on-surface-variant">TYPE</th>
              <th class="px-md py-sm font-label-caps text-label-caps text-on-surface-variant">DEPTH</th>
              <th class="px-md py-sm font-label-caps text-label-caps text-on-surface-variant">DIAM</th>
              <th class="px-md py-sm font-label-caps text-label-caps text-on-surface-variant text-center">DECKS</th>
              <th class="px-md py-sm font-label-caps text-label-caps text-on-surface-variant">CHARGE</th>
              <th class="px-md py-sm font-label-caps text-label-caps text-on-surface-variant">PRODUCT</th>
              <th class="px-md py-sm font-label-caps text-label-caps text-on-surface-variant">MODIFIED</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-quarry" id="tbody-${i}">
    `;
    
    holes.forEach(hole => {
      const depth = hole.plannedDepthRecord?.value || 'N/A';
      const diam = hole.plannedDiameterRecord?.value || 'N/A';
      const decks = hole.decks?.length || hole.numberOfDecks || 1;
      const charge = hole.decks?.[0]?.plannedChargeRecord?.value || 'N/A';
      const product = hole.decks?.[0]?.plannedChargeRecord?.product || 'N/A';
      const displayCharge = charge !== 'N/A' ? charge + ' kg' : 'N/A';
      
      html += `
          <tr class="hover:bg-surface-container-low transition-colors">
            <td class="px-md py-sm font-body-md text-body-md font-bold text-ore">${hole.name || hole.holeName || 'N/A'}</td>
            <td class="px-md py-sm font-body-md text-body-md text-on-surface-variant">${hole.type || 'Production'}</td>
            <td class="px-md py-sm font-body-md text-body-md">${depth} m</td>
            <td class="px-md py-sm font-body-md text-body-md">${diam} mm</td>
            <td class="px-md py-sm font-body-md text-body-md text-center">${decks}</td>
            <td class="px-md py-sm font-body-md text-body-md font-bold text-primary">${displayCharge}</td>
            <td class="px-md py-sm font-body-md text-body-md"><span class="bg-quarry/30 px-2 py-1 rounded text-xs font-bold">${product}</span></td>
            <td class="px-md py-sm font-body-md text-body-md text-on-surface-variant">${formatDate(upload.created?._seconds)}</td>
          </tr>
      `;
    });
    
    html += `
          </tbody>
        </table>
      </div>
      <div class="p-sm bg-surface-container-low border-t border-quarry flex justify-between items-center">
        <span class="font-label-caps text-label-caps text-on-surface-variant">Showing <span id="count-${i}">${holes.length}</span> of ${holes.length} records</span>
        <button class="font-label-caps text-label-caps text-primary hover:underline flex items-center gap-xs view-all-btn" data-section="${sectionId}" data-count="${holes.length}">
          VIEW ALL ${holes.length} RECORDS
          <span class="material-symbols-outlined text-sm">expand_more</span>
        </button>
      </div>
    </section>
    `;
  });

  document.getElementById('uploads-container').innerHTML = html;

  // Handle View All Records toggle
  document.querySelectorAll('.view-all-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const sectionId = this.getAttribute('data-section');
      const totalCount = parseInt(this.getAttribute('data-count'));
      const section = document.getElementById(sectionId);
      const tbody = section.querySelector('tbody');
      const rows = tbody.querySelectorAll('tr');
      
      // Toggle all rows visibility (for extensibility - currently all shown)
      // This allows future implementation of pagination
      const icon = this.querySelector('.material-symbols-outlined');
      if (icon.textContent === 'expand_more') {
        icon.textContent = 'expand_less';
        this.innerHTML = 'COLLAPSE RECORDS <span class="material-symbols-outlined text-sm">expand_less</span>';
      } else {
        icon.textContent = 'expand_more';
        this.innerHTML = `VIEW ALL ${totalCount} RECORDS <span class="material-symbols-outlined text-sm">expand_more</span>`;
      }
    });
  });
});
</script>
</body></html>
